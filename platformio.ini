; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = platformio/espressif32@6.11.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; upload_port = /dev/cu.usbserial-0001
; monitor_port = /dev/cu.usbserial-0001
build_src_filter = +<*> -<ble_telemetry.cpp>
board_build.partitions = huge_app.csv
board_build.flash_mode = qio

[env:esp32-usb-logging]
extends = env:esp32doit-devkit-v1
monitor_speed = 460800
build_flags = -DTAILWIND_USB_LOGGING
build_src_filter = ${env:esp32doit-devkit-v1.build_src_filter} -<wifi_telemetry.cpp>

[env:esp32-usb-logging-wifi]
extends = env:esp32-usb-logging
build_flags = ${env:esp32-usb-logging.build_flags} -DTAILWIND_USB_LOGGING_WIFI
build_src_filter = ${env:esp32doit-devkit-v1.build_src_filter}

[env:test]
platform = native
test_framework = unity
test_ignore = test_integration
lib_deps = 
	throwtheswitch/Unity@^2.5.2
	bblanchon/ArduinoJson@^7.4.2
build_flags = 
	-DUNIT_TEST
	-std=c++17
	-DARDUINO=100
	-DESP32
lib_compat_mode = off
